name: 🐛 Bug report
description: Report a bug or unexpected behavior in this documentation template
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below so we can reproduce and fix the issue quickly.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I am running the latest commit on `main` (or a recent fork).
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the template does this affect?
      options:
        - "content (MDX files / frontmatter)"
        - "layout (theme / sidebar / navigation)"
        - "search (Orama / /api/search)"
        - "llms.txt, llms-full.txt, llms.mdx (content negotiation)"
        - "og images (/og/docs/...)"
        - "proxy / content negotiation middleware"
        - "CI workflows (.github/workflows/)"
        - "documentation (README / setup instructions)"
        - "build / packaging / dependencies"
        - "other / not sure"
      default: 0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "22.4.0"
    validations:
      required: true

  - type: input
    id: pnpm-version
    attributes:
      label: pnpm version
      description: Output of `pnpm --version`.
      placeholder: "10.9.0"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit / branch
      description: Which commit hash, branch, or tag are you on? (run `git rev-parse HEAD`)
      placeholder: "abc1234 / main / v0.0.4"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
      placeholder: "`pnpm build` fails with ... but I expected ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands, file paths, or MDX snippets that reproduces the problem.
      placeholder: |
        1. Clone the repo
        2. Run `pnpm install`
        3. Run `pnpm dev`
        4. Open http://localhost:3000/docs/test
        5. See error / wrong rendering
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — OS, browser, screenshots, related issues, deployment target.
    validations:
      required: false
